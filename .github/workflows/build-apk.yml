name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Build web (Vite)
        run: npm run build

      - name: Gerar projeto Android (Capacitor)
        run: |
          npx cap add android
          npx capacitor-assets generate --android --splashBackgroundColor '#06080F'
          npx cap sync android

      - name: Versão do app
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            cp keystore/acervo.jks "$RUNNER_TEMP/release.jks"
          fi

      - name: Compilar APK assinado
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'acervo-app-key' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'acervo' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'acervo-app-key' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Acervo-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Acervo-${{ env.VERSION }}
          path: Acervo-${{ env.VERSION }}.apk

      - name: Publicar no GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Acervo ${{ env.VERSION }}
          make_latest: true
          files: Acervo-${{ env.VERSION }}.apk
          body: |
            🌐 **Versão web:** https://thesousaleo.github.io/Acervo/

            📱 **Android:** baixe o `Acervo-${{ env.VERSION }}.apk` abaixo no celular.

            APK do Acervo para Android, gerado automaticamente a partir do commit ${{ github.sha }}.
            Baixe o arquivo `.apk` abaixo no celular e toque para instalar (permita "instalar apps desconhecidos" se o Android pedir).
            Versões novas instalam por cima e mantêm seus dados.
